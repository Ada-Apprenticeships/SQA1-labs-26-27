[project]
name = "sqa-events-lab"
version = "0.1.0"
description = "Practice repository for the SQA1 labs"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mutmut>=3.8.1",
    "pip-audit>=2.10.1",
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]


[tool.mutmut]
source_paths = ["app/"]
only_mutate = ["app/booking_rules.py"]
pytest_add_cli_args_test_selection = ["tests/test_booking_rules.py"]
