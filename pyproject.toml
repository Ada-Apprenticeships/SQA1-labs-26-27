[project]
name = "sqa-events-lab"
version = "0.1.0"
description = "Practice repository for the SQA1 labs"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "urllib3==1.26.5",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
